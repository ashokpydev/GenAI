services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: sqlite:///./contextops.db
      ANALYTICS_DATABASE_URL: sqlite:///./demo_analytics.db
      SECRET_KEY: local-dev-secret
      LLM_PROVIDER: ollama
      VECTOR_STORE_PROVIDER: chroma
      USE_BACKGROUND_INDEXING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
